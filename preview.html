<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>anime-avatars 预览 (50 张)</title>
<style>
  body { background:#111; color:#eee; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin:0; padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:#999; font-size:13px; margin:0 0 20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:12px; }
  .cell { background:#1d1d1f; border:1px solid #2c2c2e; border-radius:10px; overflow:hidden; }
  .cell img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
  .cell .name { padding:6px 8px; font-size:11px; color:#aaa; font-family: ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<h1>anime-avatars — 50 张可选头像 (256×256)</h1>
<p class="sub">来源: <a href="https://github.com/learner-lu/anime-face-dataset" style="color:#6cf">learner-lu/anime-face-dataset</a> · 文件位于 avatars/ 目录</p>
<div class="grid" id="grid"></div>
<script>
  const manifest = [
    "avatar_001.jpg","avatar_002.jpg","avatar_003.jpg","avatar_004.jpg","avatar_005.jpg",
    "avatar_006.jpg","avatar_007.jpg","avatar_008.jpg","avatar_009.jpg","avatar_010.jpg",
    "avatar_011.jpg","avatar_012.jpg","avatar_013.jpg","avatar_014.jpg","avatar_015.jpg",
    "avatar_016.jpg","avatar_017.jpg","avatar_018.jpg","avatar_019.jpg","avatar_020.jpg",
    "avatar_021.jpg","avatar_022.jpg","avatar_023.jpg","avatar_024.jpg","avatar_025.jpg",
    "avatar_026.jpg","avatar_027.jpg","avatar_028.jpg","avatar_029.jpg","avatar_030.jpg",
    "avatar_031.jpg","avatar_032.jpg","avatar_033.jpg","avatar_034.jpg","avatar_035.jpg",
    "avatar_036.jpg","avatar_037.jpg","avatar_038.jpg","avatar_039.jpg","avatar_040.jpg",
    "avatar_041.jpg","avatar_042.jpg","avatar_043.jpg","avatar_044.jpg","avatar_045.jpg",
    "avatar_046.jpg","avatar_047.jpg","avatar_048.jpg","avatar_049.jpg","avatar_050.jpg"
  ];
  const grid = document.getElementById('grid');
  for (const f of manifest) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const img = document.createElement('img');
    img.src = 'avatars/' + f; img.loading = 'lazy'; img.alt = f;
    const name = document.createElement('div');
    name.className = 'name'; name.textContent = f;
    cell.appendChild(img); cell.appendChild(name);
    grid.appendChild(cell);
  }
</script>
</body>
</html>
